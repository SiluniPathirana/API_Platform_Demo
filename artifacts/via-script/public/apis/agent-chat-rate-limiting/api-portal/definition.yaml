openapi: 3.0.1
info:
  title: Agent Chat API
  version: v1.0
  description: |
    Send a chat/completions request to the WK AI agent. Your JWT's org_name
    claim identifies your organization for rate-limiting purposes; the
    X-Use-Case-Id header identifies which use-case within your
    organization the call belongs to. Each org has its own org-wide token
    budget PLUS its own per-use-case budgets, checked independently -- any
    one being exhausted blocks the call (429), even if the others still
    have room.
servers:
  - url: http://localhost:8080/agent/v1.0
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A valid access token from the organization's own OAuth2
        application (client_credentials) or a logged-in user
        (authorization_code), issued by the org's WSO2 IS key manager.
        Its org_name claim determines which set of token-budget quotas
        applies.
  parameters:
    UseCaseIdHeader:
      name: X-Use-Case-Id
      in: header
      required: false
      description: >
        Identifies the use-case within the caller's organization. A
        use-case with no dedicated quota configured is only ever gated by
        the org-wide budget.
      schema:
        type: string
        example: usecase1
  schemas:
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          example: What's the status of order #12345?
    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    ChatCompletionResponse:
      type: object
      properties:
        result:
          type: string
          example: Agent response
        usage:
          type: object
          properties:
            completion_tokens:
              type: integer
              example: 50
paths:
  /chat/completions:
    post:
      summary: Send a chat/completions request to the agent
      description: >
        Returns 429 if the caller's organization or use-case token budget
        is exhausted -- the x-ratelimit-quota response header names which
        quota blocked the call.
      parameters:
        - $ref: '#/components/parameters/UseCaseIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: OK. The agent's response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '401':
          description: Unauthorized. Missing or invalid JWT.
        '429':
          description: >
            Too Many Requests. The org-wide or use-case-specific token
            budget is exhausted for this minute.
          headers:
            x-ratelimit-quota:
              description: Name of the quota that blocked this call.
              schema:
                type: string
            x-ratelimit-remaining:
              description: Tokens remaining in the blocking quota.
              schema:
                type: integer
