apiVersion: api-portal.api-platform.wso2.com/v1
kind: MCP

metadata:
  name: geo-mcp-server-v1-0

spec:
  type: MCP
  displayName: Geo MCP Server
  version: v1.0
  description: MCP proxy exposing forward and reverse geocoding as tools, backed by the Geo Location API.
  status: PUBLISHED

  tags:
    - mcp
    - geo
    - ai-agent

  labels:
    - default

  subscriptionPlans:
    - Gold

  agentVisibility: VISIBLE

  businessInformation:
    businessOwner: Platform Owner
    businessOwnerEmail: support@example.com
    technicalOwner: API Team
    technicalOwnerEmail: architecture@example.com

  endpoints:
    productionUrl: http://localhost:9090/mcp/geo
    sandboxUrl: http://localhost:9090/mcp/geo
